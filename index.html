<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>古堅南FC Ver.2</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js"></script>
<style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;margin:0;background:#f4f7fb;color:#172033}header{background:#0284c7;color:white;padding:16px}nav{display:flex;gap:8px;overflow:auto;padding:10px;background:white;position:sticky;top:0}button{border:0;border-radius:9px;padding:10px 13px;background:#0284c7;color:white;font-weight:700}.page{display:none}.show{display:block}main{max-width:1100px;margin:auto;padding:12px}.card{background:white;border:1px solid #dbe3ec;border-radius:14px;padding:14px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px}.stat b{display:block;font-size:28px;color:#075985}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{padding:9px;border-bottom:1px solid #ddd;text-align:left}input,select{width:100%;padding:10px;margin:4px 0;border:1px solid #ccc;border-radius:8px}.hidden{display:none}.notice{background:#fff7ed;padding:10px;border-radius:9px;color:#9a3412}</style></head>
<body><header><h2>⚽ 古堅南FC Ver.2</h2><div id="mode">保護者閲覧モード</div></header>
<nav><button onclick="show('home')">ホーム</button><button onclick="show('players')">選手</button><button onclick="show('match')">試合入力</button><button onclick="show('ranking')">ランキング</button><button onclick="show('login')">コーチログイン</button></nav>
<main><div id="err" class="notice hidden"></div>
<section id="home" class="page show"><div id="stats" class="grid"></div><div class="card"><h3>最近の試合</h3><div id="recent"></div></div></section>
<section id="players" class="page"><div class="card"><h3>選手一覧</h3><div class="table"><table><thead><tr><th>名前</th><th>学年</th><th>位置</th><th>出場</th><th>得点</th><th>アシスト</th></tr></thead><tbody id="pb"></tbody></table></div></div></section>
<section id="match" class="page"><div class="card"><h3>試合入力</h3><div id="needLogin" class="notice">コーチログイン後に入力できます。</div><div id="mf" class="hidden"><input id="date" type="date"><input id="comp" placeholder="大会名"><input id="opp" placeholder="対戦相手"><input id="venue" placeholder="会場"><input id="gf" type="number" value="0" placeholder="古堅南FC得点"><input id="ga" type="number" value="0" placeholder="相手得点"><button onclick="saveMatch()">保存</button></div></div></section>
<section id="ranking" class="page"><div class="card"><h3>ランキング</h3><select id="rt" onchange="render()"><option value="apps">出場数</option><option value="goals">得点</option><option value="assists">アシスト</option></select><div class="table"><table><thead><tr><th>順位</th><th>選手</th><th>学年</th><th>記録</th></tr></thead><tbody id="rb"></tbody></table></div></div></section>
<section id="login" class="page"><div class="card"><h3>コーチログイン</h3><div id="out"><input id="email" type="email" placeholder="メール"><input id="pw" type="password" placeholder="パスワード"><button onclick="login()">ログイン</button></div><div id="inside" class="hidden"><p id="who"></p><button onclick="logout()">ログアウト</button></div></div></section></main>
<script>
let sb,session,profile,players=[],matches=[],records=[];
function show(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('show'));document.getElementById(id).classList.add('show')}
function staff(){return profile&&profile.active&&['admin','coach'].includes(profile.role)}
async function init(){const c=window.FURUGEN_CONFIG;if(!c||c.SUPABASE_ANON_KEY.includes('ここに')){err.classList.remove('hidden');err.textContent='config.jsに公開可能なキーを設定してください。';return}sb=supabase.createClient(c.SUPABASE_URL,c.SUPABASE_ANON_KEY);let x=await sb.auth.getSession();session=x.data.session;await loadProfile();await load();sb.auth.onAuthStateChange(async(_,s)=>{session=s;await loadProfile();await load()})}
async function loadProfile(){profile=null;if(session){let x=await sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle();profile=x.data}mode.textContent=staff()?(session.user.email+'（'+profile.role+'）'):'保護者閲覧モード';out.classList.toggle('hidden',!!session);inside.classList.toggle('hidden',!session);mf.classList.toggle('hidden',!staff());needLogin.classList.toggle('hidden',staff());if(session)who.textContent=session.user.email}
async function load(){let [p,m,r]=await Promise.all([sb.from('players').select('*'),sb.from('matches').select('*').order('match_date',{ascending:false}),sb.from('records').select('*')]);players=p.data||[];matches=m.data||[];records=r.data||[];render()}
function total(p){let rr=records.filter(x=>x.player_id===p.id);return{apps:(p.past_apps||0)+rr.filter(x=>x.played).length,goals:(p.past_goals||0)+rr.reduce((a,x)=>a+(x.goals||0),0),assists:(p.past_assists||0)+rr.reduce((a,x)=>a+(x.assists||0),0)}}
function render(){let w=0,d=0,l=0;matches.forEach(m=>m.goals_for>m.goals_against?w++:m.goals_for<m.goals_against?l++:d++);stats.innerHTML=[['選手',players.length],['試合',matches.length],['勝利',w],['引分',d],['敗戦',l]].map(x=>'<div class="card stat"><span>'+x[0]+'</span><b>'+x[1]+'</b></div>').join('');recent.innerHTML=matches.slice(0,5).map(m=>'<p><b>'+m.match_date+'</b> 古堅南FC '+m.goals_for+'-'+m.goals_against+' '+m.opponent+'</p>').join('')||'まだ試合がありません。';pb.innerHTML=players.map(p=>{let t=total(p);return'<tr><td><b>'+p.name+'</b></td><td>'+p.grade+'</td><td>'+p.position+'</td><td>'+t.apps+'</td><td>'+t.goals+'</td><td>'+t.assists+'</td></tr>'}).join('');let type=rt.value;rb.innerHTML=players.map(p=>({p,t:total(p)})).sort((a,b)=>b.t[type]-a.t[type]).map((x,i)=>'<tr><td>'+(i+1)+'</td><td>'+x.p.name+'</td><td>'+x.p.grade+'</td><td>'+x.t[type]+'</td></tr>').join('')}
async function login(){let x=await sb.auth.signInWithPassword({email:email.value,password:pw.value});if(x.error)alert(x.error.message)}
async function logout(){await sb.auth.signOut()}
async function saveMatch(){if(!date.value||!opp.value)return alert('日付と対戦相手を入力してください');let x=await sb.from('matches').insert({match_date:date.value,competition:comp.value,opponent:opp.value,venue:venue.value,goals_for:+gf.value,goals_against:+ga.value,season:+date.value.slice(0,4),created_by:session.user.id});if(x.error)alert(x.error.message);else{alert('保存しました');await load()}}
init();
</script></body></html>
