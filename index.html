<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0284c7">
<link rel="manifest" href="./manifest.webmanifest">
<title>古堅南FC Ver.3</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config.js"></script>
<style>
:root{--blue:#0284c7;--deep:#075985;--sky:#e0f2fe;--bg:#f4f7fb;--line:#dbe3ec;--text:#172033;--danger:#dc2626;--ok:#15803d}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:var(--bg);color:var(--text)}
header{background:linear-gradient(135deg,var(--blue),var(--deep));color:#fff;padding:18px max(14px,env(safe-area-inset-left));box-shadow:0 3px 16px #0c4a6e44}.title{font-size:22px;font-weight:900}.subtitle{font-size:13px;opacity:.9;margin-top:4px}
nav{display:flex;gap:7px;overflow:auto;padding:10px;background:#fff;position:sticky;top:0;z-index:10;border-bottom:1px solid var(--line)}nav button{white-space:nowrap}
button{border:0;border-radius:10px;padding:10px 13px;background:var(--blue);color:#fff;font-weight:800;cursor:pointer}button.secondary{background:#64748b}button.danger{background:var(--danger)}button.light{background:var(--sky);color:var(--deep)}button:disabled{opacity:.5;cursor:not-allowed}
main{max-width:1180px;margin:auto;padding:14px}.page{display:none}.page.show{display:block}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px;margin-bottom:12px;box-shadow:0 3px 10px #0f172a0a}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.stat b{display:block;font-size:28px;color:var(--deep);margin-top:4px}.muted{color:#64748b;font-size:13px}.notice{padding:11px;border-radius:10px;background:#fff7ed;color:#9a3412;margin-bottom:12px}.success{background:#f0fdf4;color:#166534}.hidden{display:none!important}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:end}.field{flex:1;min-width:145px}label{font-size:12px;font-weight:800;color:#475569;display:block;margin-bottom:3px}input,select,textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:9px;background:#fff;font:inherit}textarea{min-height:76px}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:9px;border-bottom:1px solid #e5e7eb;text-align:left;font-size:14px}th{position:sticky;top:0;background:#f8fafc}.rank1{font-weight:900;color:#b45309}.pill{display:inline-block;padding:3px 8px;border-radius:999px;background:var(--sky);color:var(--deep);font-size:12px;font-weight:800}.match-row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid #e5e7eb}.score{font-size:20px;font-weight:900}.win{color:#15803d}.draw{color:#a16207}.loss{color:#b91c1c}
.player-entry{display:grid;grid-template-columns:minmax(130px,1.5fr) 70px 70px 70px 70px 70px 70px 70px;gap:6px;align-items:center;padding:7px 0;border-bottom:1px solid #edf2f7}.player-entry input{padding:8px}.checkline{display:flex;align-items:center;gap:7px}.checkline input{width:auto}.section-title{display:flex;justify-content:space-between;gap:10px;align-items:center}.modal{position:fixed;inset:0;background:#0f172a88;display:flex;align-items:center;justify-content:center;padding:15px;z-index:100}.modal-box{background:#fff;border-radius:16px;padding:17px;max-width:620px;width:100%;max-height:90vh;overflow:auto}
@media(max-width:760px){header{padding-top:calc(14px + env(safe-area-inset-top))}.player-entry{grid-template-columns:1fr 55px 55px 55px;}.player-entry .extra{display:none}table{min-width:680px}.title{font-size:20px}}
</style>
</head>
<body>
<header><div class="title">⚽ 古堅南FC Ver.3</div><div id="mode" class="subtitle">保護者閲覧モード</div></header>
<nav>
<button onclick="showPage('home')">ホーム</button><button onclick="showPage('players')">選手</button><button onclick="showPage('matches')">試合</button><button onclick="showPage('entry')">試合入力</button><button onclick="showPage('ranking')">ランキング</button><button onclick="showPage('login')">コーチログイン</button>
</nav>
<main>
<div id="message" class="notice hidden"></div>
<section id="home" class="page show"><div id="stats" class="grid"></div><div class="card"><div class="section-title"><h3>最近の試合</h3><button class="light" onclick="exportAllCsv()">CSV出力</button></div><div id="recent"></div></div></section>
<section id="players" class="page"><div class="card"><div class="section-title"><h3>選手一覧</h3><button id="addPlayerBtn" class="hidden" onclick="openPlayerModal()">選手追加</button></div><div class="toolbar"><div class="field"><label>検索</label><input id="playerSearch" placeholder="名前・学年・ポジション" oninput="renderPlayers()"></div><div class="field"><label>状態</label><select id="statusFilter" onchange="renderPlayers()"><option value="">すべて</option><option>現役</option><option>卒団</option><option>退団</option></select></div></div><div class="table"><table><thead><tr><th>名前</th><th>学年</th><th>位置</th><th>状態</th><th>出場</th><th>得点</th><th>アシスト</th><th>時間</th><th>操作</th></tr></thead><tbody id="playerBody"></tbody></table></div></div></section>
<section id="matches" class="page"><div class="card"><h3>試合一覧</h3><div class="toolbar"><div class="field"><label>年度</label><select id="matchSeason" onchange="renderMatches()"><option value="">すべて</option></select></div><div class="field"><label>大会・相手検索</label><input id="matchSearch" oninput="renderMatches()"></div></div><div id="matchList"></div></div></section>
<section id="entry" class="page"><div class="card"><h3>試合と選手記録をまとめて入力</h3><div id="needLogin" class="notice">管理者またはコーチでログインすると入力できます。</div><div id="entryForm" class="hidden">
<div class="grid"><div><label>試合日</label><input id="matchDate" type="date"></div><div><label>大会名</label><input id="competition"></div><div><label>対戦相手</label><input id="opponent"></div><div><label>会場</label><input id="venue"></div><div><label>古堅南FC得点</label><input id="goalsFor" type="number" min="0" value="0"></div><div><label>相手得点</label><input id="goalsAgainst" type="number" min="0" value="0"></div></div><label>メモ</label><textarea id="matchMemo"></textarea>
<div class="section-title"><h4>選手記録</h4><button class="light" onclick="selectAllPlayed()">全員出場にする</button></div><div class="muted">出場にチェックし、時間・得点・アシスト・カード・MVPを入力してください。</div><div id="recordInputs"></div><br><button id="saveMatchBtn" onclick="saveMatchWithRecords()">試合を保存</button></div></div></section>
<section id="ranking" class="page"><div class="card"><h3>ランキング</h3><div class="toolbar"><div class="field"><label>項目</label><select id="rankType" onchange="renderRanking()"><option value="apps">出場試合数</option><option value="minutes">出場時間</option><option value="goals">得点</option><option value="assists">アシスト</option><option value="yellow">イエロー</option><option value="red">レッド</option><option value="mvp">MVP</option></select></div><div class="field"><label>学年</label><select id="rankGrade" onchange="renderRanking()"><option value="">すべて</option></select></div><div class="field"><label>状態</label><select id="rankStatus" onchange="renderRanking()"><option value="">すべて</option><option>現役</option><option>卒団</option><option>退団</option></select></div></div><div class="table"><table><thead><tr><th>順位</th><th>選手</th><th>学年</th><th>ポジション</th><th>記録</th></tr></thead><tbody id="rankBody"></tbody></table></div></div></section>
<section id="login" class="page"><div class="card"><h3>管理者・コーチログイン</h3><div id="loginOut"><label>メール</label><input id="loginEmail" type="email"><label>パスワード</label><input id="loginPassword" type="password"><br><button onclick="login()">ログイン</button></div><div id="loginIn" class="hidden"><p id="loginWho"></p><button class="secondary" onclick="logout()">ログアウト</button></div><hr><div class="muted">保護者はログインせず閲覧できます。入力権限はSupabaseの profiles テーブルで admin または coach に設定したアカウントだけです。</div></div></section>
</main>
<div id="playerModal" class="modal hidden"><div class="modal-box"><h3 id="playerModalTitle">選手追加</h3><input id="editPlayerId" type="hidden"><div class="grid"><div><label>名前</label><input id="editName"></div><div><label>背番号</label><input id="editNumber"></div><div><label>学年</label><input id="editGrade"></div><div><label>ポジション</label><input id="editPosition" placeholder="GP・DF・MF・FW"></div><div><label>状態</label><select id="editStatus"><option>現役</option><option>卒団</option><option>退団</option></select></div></div><h4>過去通算成績</h4><div class="grid"><div><label>出場</label><input id="editPastApps" type="number" min="0"></div><div><label>得点</label><input id="editPastGoals" type="number" min="0"></div><div><label>アシスト</label><input id="editPastAssists" type="number" min="0"></div><div><label>イエロー</label><input id="editPastYellow" type="number" min="0"></div><div><label>レッド</label><input id="editPastRed" type="number" min="0"></div></div><br><button onclick="savePlayer()">保存</button> <button class="secondary" onclick="closePlayerModal()">閉じる</button></div></div>
<script>
let sb=null,session=null,profile=null,players=[],matches=[],records=[];
const $=id=>document.getElementById(id);
function showMessage(text,type='warn'){const e=$('message');e.textContent=text;e.className=(type==='ok'?'notice success':'notice');e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),5000)}
function showPage(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('show'));$(id).classList.add('show');if(id==='entry')renderRecordInputs()}
function isStaff(){return !!(profile&&profile.active&&['admin','coach'].includes(profile.role))}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
async function init(){const c=window.FURUGEN_CONFIG;if(!c||!c.SUPABASE_URL||!c.SUPABASE_ANON_KEY){showMessage('config.jsの設定がありません。');return}sb=supabase.createClient(c.SUPABASE_URL,c.SUPABASE_ANON_KEY);const x=await sb.auth.getSession();session=x.data.session;await loadProfile();await loadAll();setupRealtime();sb.auth.onAuthStateChange(async(_,s)=>{session=s;await loadProfile();await loadAll()});if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{})}
async function loadProfile(){profile=null;if(session){const r=await sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle();profile=r.data}const staff=isStaff();$('mode').textContent=staff?`${session.user.email}（${profile.role==='admin'?'管理者':'コーチ'}）`:'保護者閲覧モード';$('loginOut').classList.toggle('hidden',!!session);$('loginIn').classList.toggle('hidden',!session);$('entryForm').classList.toggle('hidden',!staff);$('needLogin').classList.toggle('hidden',staff);$('addPlayerBtn').classList.toggle('hidden',!staff);if(session)$('loginWho').textContent=`${session.user.email} / 権限：${profile?.role||'未設定'}`}
async function loadAll(){const [p,m,r]=await Promise.all([sb.from('players').select('*').order('grade').order('name'),sb.from('matches').select('*').order('match_date',{ascending:false}),sb.from('records').select('*')]);if(p.error||m.error||r.error){showMessage('データ取得エラー：'+(p.error||m.error||r.error).message);return}players=p.data||[];matches=m.data||[];records=r.data||[];refreshFilters();renderAll()}
function setupRealtime(){sb.channel('furugen-live').on('postgres_changes',{event:'*',schema:'public',table:'players'},loadAll).on('postgres_changes',{event:'*',schema:'public',table:'matches'},loadAll).on('postgres_changes',{event:'*',schema:'public',table:'records'},loadAll).subscribe()}
function totals(p){const rr=records.filter(x=>x.player_id===p.id);return{apps:(p.past_apps||0)+rr.filter(x=>x.played).length,minutes:rr.reduce((a,x)=>a+(x.minutes||0),0),goals:(p.past_goals||0)+rr.reduce((a,x)=>a+(x.goals||0),0),assists:(p.past_assists||0)+rr.reduce((a,x)=>a+(x.assists||0),0),yellow:(p.past_yellow||0)+rr.reduce((a,x)=>a+(x.yellow||0),0),red:(p.past_red||0)+rr.reduce((a,x)=>a+(x.red||0),0),mvp:rr.filter(x=>x.mvp).length}}
function refreshFilters(){const seasons=[...new Set(matches.map(x=>x.season||String(x.match_date||'').slice(0,4)).filter(Boolean))].sort().reverse();$('matchSeason').innerHTML='<option value="">すべて</option>'+seasons.map(x=>`<option>${x}</option>`).join('');const grades=[...new Set(players.map(x=>x.grade).filter(Boolean))].sort();$('rankGrade').innerHTML='<option value="">すべて</option>'+grades.map(x=>`<option>${esc(x)}</option>`).join('')}
function renderAll(){renderDashboard();renderPlayers();renderMatches();renderRanking();renderRecordInputs()}
function renderDashboard(){let w=0,d=0,l=0,gf=0,ga=0;matches.forEach(m=>{gf+=m.goals_for||0;ga+=m.goals_against||0;m.goals_for>m.goals_against?w++:m.goals_for<m.goals_against?l++:d++});const rate=matches.length?Math.round(w/matches.length*100):0;$('stats').innerHTML=[['選手',players.length],['試合',matches.length],['勝利',w],['引分',d],['敗戦',l],['勝率',rate+'%'],['得点',gf],['失点',ga]].map(x=>`<div class="card stat"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('');$('recent').innerHTML=matches.slice(0,6).map(matchHtml).join('')||'<p class="muted">まだ試合がありません。</p>'}
function resultClass(m){return m.goals_for>m.goals_against?'win':m.goals_for<m.goals_against?'loss':'draw'}
function matchHtml(m){return `<div class="match-row"><div><b>${esc(m.match_date)}</b> <span class="pill">${esc(m.competition||'通常試合')}</span><div class="muted">${esc(m.venue||'')} ${esc(m.memo||'')}</div></div><div><span class="score ${resultClass(m)}">${m.goals_for} - ${m.goals_against}</span><br>${esc(m.opponent)}</div></div>`}
function renderPlayers(){const q=$('playerSearch').value.trim().toLowerCase(),status=$('statusFilter').value;const list=players.filter(p=>(!status||p.status===status)&&(!q||`${p.name} ${p.grade} ${p.position}`.toLowerCase().includes(q)));$('playerBody').innerHTML=list.map(p=>{const t=totals(p);return `<tr><td><b>${esc(p.name)}</b>${p.number?` #${esc(p.number)}`:''}</td><td>${esc(p.grade)}</td><td>${esc(p.position)}</td><td>${esc(p.status)}</td><td>${t.apps}</td><td>${t.goals}</td><td>${t.assists}</td><td>${t.minutes}</td><td>${isStaff()?`<button class="light" onclick="openPlayerModal('${p.id}')">編集</button>`:''}</td></tr>`}).join('')}
function renderMatches(){const season=$('matchSeason').value,q=$('matchSearch').value.trim().toLowerCase();const list=matches.filter(m=>(!season||String(m.season)===season)&&(!q||`${m.competition} ${m.opponent} ${m.venue}`.toLowerCase().includes(q)));$('matchList').innerHTML=list.map(m=>{const count=records.filter(r=>r.match_id===m.id&&r.played).length;return `<div class="card"><div class="match-row"><div><b>${esc(m.match_date)}</b> ${esc(m.competition)}<div class="muted">${esc(m.venue)} / 出場 ${count}名</div></div><div><span class="score ${resultClass(m)}">${m.goals_for}-${m.goals_against}</span> ${esc(m.opponent)} ${isStaff()?`<button class="danger" onclick="deleteMatch('${m.id}')">削除</button>`:''}</div></div></div>`}).join('')||'<p class="muted">該当する試合がありません。</p>'}
function renderRanking(){const type=$('rankType').value,grade=$('rankGrade').value,status=$('rankStatus').value;const list=players.filter(p=>(!grade||p.grade===grade)&&(!status||p.status===status)).map(p=>({p,t:totals(p)})).sort((a,b)=>b.t[type]-a.t[type]||a.p.name.localeCompare(b.p.name,'ja'));$('rankBody').innerHTML=list.map((x,i)=>`<tr><td class="${i===0?'rank1':''}">${i+1}</td><td><b>${esc(x.p.name)}</b></td><td>${esc(x.p.grade)}</td><td>${esc(x.p.position)}</td><td><b>${x.t[type]}</b>${type==='minutes'?'分':''}</td></tr>`).join('')}
function renderRecordInputs(){if(!isStaff())return;$('recordInputs').innerHTML=`<div class="player-entry muted"><div>選手</div><div>出場</div><div>時間</div><div>得点</div><div class="extra">アシスト</div><div class="extra">黄</div><div class="extra">赤</div><div class="extra">MVP</div></div>`+players.filter(p=>p.status==='現役').map(p=>`<div class="player-entry" data-player="${p.id}"><div><b>${esc(p.name)}</b><div class="muted">${esc(p.grade)} ${esc(p.position)}</div></div><div><input class="played" type="checkbox"></div><div><input class="minutes" type="number" min="0" value="0"></div><div><input class="goals" type="number" min="0" value="0"></div><div class="extra"><input class="assists" type="number" min="0" value="0"></div><div class="extra"><input class="yellow" type="number" min="0" value="0"></div><div class="extra"><input class="red" type="number" min="0" value="0"></div><div class="extra"><input class="mvp" type="checkbox"></div></div>`).join('')}
function selectAllPlayed(){document.querySelectorAll('.player-entry .played').forEach(x=>x.checked=true)}
async function saveMatchWithRecords(){if(!isStaff())return;const date=$('matchDate').value,opp=$('opponent').value.trim();if(!date||!opp){showMessage('試合日と対戦相手を入力してください。');return}const btn=$('saveMatchBtn');btn.disabled=true;const match={match_date:date,competition:$('competition').value.trim(),opponent:opp,venue:$('venue').value.trim(),goals_for:+$('goalsFor').value||0,goals_against:+$('goalsAgainst').value||0,season:+date.slice(0,4),memo:$('matchMemo').value.trim(),created_by:session.user.id};const ins=await sb.from('matches').insert(match).select().single();if(ins.error){showMessage(ins.error.message);btn.disabled=false;return}const rows=[...document.querySelectorAll('.player-entry[data-player]')].map(el=>({match_id:ins.data.id,player_id:el.dataset.player,played:el.querySelector('.played').checked,minutes:+el.querySelector('.minutes').value||0,goals:+el.querySelector('.goals').value||0,assists:+el.querySelector('.assists').value||0,yellow:+el.querySelector('.yellow').value||0,red:+el.querySelector('.red').value||0,mvp:el.querySelector('.mvp').checked,created_by:session.user.id})).filter(x=>x.played||x.goals||x.assists||x.yellow||x.red||x.mvp);if(rows.length){const rr=await sb.from('records').insert(rows);if(rr.error){showMessage('試合は保存しましたが選手記録でエラー：'+rr.error.message);btn.disabled=false;return}}showMessage('試合と選手記録を保存しました。','ok');['competition','opponent','venue','matchMemo'].forEach(id=>$(id).value='');$('goalsFor').value=0;$('goalsAgainst').value=0;btn.disabled=false;await loadAll();showPage('matches')}
async function deleteMatch(id){if(!confirm('この試合と選手記録を削除しますか？'))return;const r=await sb.from('matches').delete().eq('id',id);r.error?showMessage(r.error.message):showMessage('削除しました。','ok')}
function openPlayerModal(id=''){const p=players.find(x=>x.id===id);$('playerModalTitle').textContent=p?'選手編集':'選手追加';$('editPlayerId').value=p?.id||'';$('editName').value=p?.name||'';$('editNumber').value=p?.number||'';$('editGrade').value=p?.grade||'';$('editPosition').value=p?.position||'';$('editStatus').value=p?.status||'現役';$('editPastApps').value=p?.past_apps||0;$('editPastGoals').value=p?.past_goals||0;$('editPastAssists').value=p?.past_assists||0;$('editPastYellow').value=p?.past_yellow||0;$('editPastRed').value=p?.past_red||0;$('playerModal').classList.remove('hidden')}
function closePlayerModal(){$('playerModal').classList.add('hidden')}
async function savePlayer(){if(!isStaff())return;const name=$('editName').value.trim();if(!name){showMessage('名前を入力してください。');return}const id=$('editPlayerId').value||('P'+Date.now().toString(36));const data={id,name,number:$('editNumber').value.trim(),grade:$('editGrade').value.trim(),position:$('editPosition').value.trim(),status:$('editStatus').value,past_apps:+$('editPastApps').value||0,past_goals:+$('editPastGoals').value||0,past_assists:+$('editPastAssists').value||0,past_yellow:+$('editPastYellow').value||0,past_red:+$('editPastRed').value||0,updated_at:new Date().toISOString()};const r=await sb.from('players').upsert(data);if(r.error)showMessage(r.error.message);else{closePlayerModal();showMessage('選手を保存しました。','ok');await loadAll()}}
async function login(){const r=await sb.auth.signInWithPassword({email:$('loginEmail').value.trim(),password:$('loginPassword').value});if(r.error)showMessage('ログイン失敗：'+r.error.message);else showMessage('ログインしました。','ok')}
async function logout(){await sb.auth.signOut();showMessage('ログアウトしました。','ok')}
function exportAllCsv(){const rows=[['名前','学年','ポジション','状態','出場','時間','得点','アシスト','黄','赤','MVP'],...players.map(p=>{const t=totals(p);return[p.name,p.grade,p.position,p.status,t.apps,t.minutes,t.goals,t.assists,t.yellow,t.red,t.mvp]})];const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='古堅南FC_選手成績.csv';a.click();URL.revokeObjectURL(a.href)}
init();
</script>
</body></html>
